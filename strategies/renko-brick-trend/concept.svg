<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8eaf6" font-family="Inter, sans-serif" font-size="24" font-weight="600">Renko Brick Trend</text>
  <text x="40" y="78" fill="#7986cb" font-family="Inter, sans-serif" font-size="14">Builds an ATR-sized Renko brick series from the price stream and trades brick direction changes,</text>
  <line x1="40" y1="96" x2="760" y2="96" stroke="#2a2e5a" stroke-width="1"/>
  <line x1="60" y1="140" x2="740" y2="140" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="320" x2="740" y2="320" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="380" x2="740" y2="380" stroke="#252a4a" stroke-width="1"/>
  <polyline points="60,340 140,340 220,300 300,300 380,260 460,260 540,300 620,220 700,220" fill="none" stroke="#42a5f5" stroke-width="3" filter="url(#glow)"/>
  <rect x="120" y="300" width="60" height="40" fill="#00e676" opacity="0.5"/><rect x="200" y="260" width="60" height="40" fill="#00e676" opacity="0.5"/><rect x="440" y="260" width="60" height="40" fill="#ef5350" opacity="0.5"/><rect x="600" y="180" width="60" height="40" fill="#00e676" opacity="0.5"/>
  <text x="400" y="440" text-anchor="middle" fill="#9fa8da" font-family="Inter, sans-serif" font-size="14">ATR-sized bricks: price must travel a full brick before anything prints</text>
</svg>
