  <rect width="800" height="500" fill="url(#bg)"/>
  <text x="40" y="52" fill="#e8eaf6" font-family="Inter, sans-serif" font-size="24" font-weight="600">Pairs Spread Trader</text>
  <text x="40" y="78" fill="#7986cb" font-family="Inter, sans-serif" font-size="14">Trades the charted leg of a pair against a partner symbol: enters when the hedge-ratio spread st</text>
  <line x1="40" y1="96" x2="760" y2="96" stroke="#2a2e5a" stroke-width="1"/>
  <line x1="60" y1="140" x2="740" y2="140" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="200" x2="740" y2="200" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="260" x2="740" y2="260" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="320" x2="740" y2="320" stroke="#252a4a" stroke-width="1"/>
  <line x1="60" y1="380" x2="740" y2="380" stroke="#252a4a" stroke-width="1"/>
  <polyline points="60,260 140,200 220,300 300,240 380,180 460,320 540,250 620,220 700,255" fill="none" stroke="#ab47bc" stroke-width="3" filter="url(#glow)"/>
  <line x1="60" y1="255" x2="740" y2="255" stroke="#7986cb" stroke-width="2"/><line x1="60" y1="185" x2="740" y2="185" stroke="#ef5350" stroke-width="1.5" stroke-dasharray="5,4"/><line x1="60" y1="325" x2="740" y2="325" stroke="#00e676" stroke-width="1.5" stroke-dasharray="5,4"/>
